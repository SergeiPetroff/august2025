<html>
    <head>
         <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    </head>
    <body>
        {% include 'components/nav.html' %}
        <div class="container">
            <table class="table table-striped table-bordered caption-top align-middle">
                <caption>Оборудование</caption>
                <tr>
                    <th>Название</th>
                    <th></th>
                </tr>
                {% for item in items %}
                <tr><td>{{ item.name }}</td>
                    <td>
                        <form method="POST" action="deleteById" class="form-inline m-0 d-inline">
                            <input type="hidden" name="equipment_id", value="{{ item.id }}">
                            <input type="submit" value="Удалить" class="btn btn-danger btn-sm">
                        </form>
                        <a href="/equipment/show?id={{item.id}}" class="btn btn-primary btn-sm">Подробнее</a>                   
                    </td>
                </tr>
                {% endfor %}
            </table>
        </div>
        <div class="container mt-2">
            <form method="POST" action="create">
                <div class="row g-2">
                    <label class="col-form-label col-2">Новое оборудование:</label>
                    <div class="col">
                         <input type="text" name="equipment_name" class="form-control" value="EquipmentN">
                    </div>
                    <div class="col">
                        <input type="submit" value="Добавить" class="btn btn-success">
                    </div>
                </div>
            </form>
        </div>
        {% include 'components/flash.html' %}
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
    </body>
</html>
